# Render Blueprint for Attendance Tracker.
#
# Provisioning two services from a single apply:
#   - attendance-db   : managed Postgres (free tier is fine for dev).
#   - attendance-api  : the Node/Express backend, bound to attendance-db
#                       via DATABASE_URL. DB_BOOTSTRAP=1 makes the API
#                       run init.sql + migrations/*.sql on first boot.
#
# After `Apply` in the Render dashboard:
#   1. The API service will be at:  https://attendance-api.onrender.com
#   2. Wire the Flutter app with:
#        flutter run --dart-define=API_BASE_URL=https://attendance-api.onrender.com
#      or rebuild a release APK with the same flag.

services:
  - type: pserv
    name: attendance-db
    plan: free
    region: oregon
    # Render creates the role + DB for us. DATABASE_URL is auto-injected
    # into the linked web service via env: from the connection details.

  - type: web
    name: attendance-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # --- Runtime / API ---
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Render injects PORT automatically; the line above is just a default
      # if Render's auto-injection is ever disabled.

      # --- Database (auto-linked from attendance-db) ---
      - key: DATABASE_URL
        fromService:
          type: pserv
          name: attendance-db
          property: connectionString
      - key: DB_SSL
        value: enable
      # First-boot migration. Set to 0 after the schema has been applied
      # (or just leave it on — the SQL is idempotent).
      - key: DB_BOOTSTRAP
        value: "1"

      # --- Security ---
      # These must be set to long random strings in production. The values
      # shown here are placeholders that will be overridden in the Render
      # dashboard on first apply.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: KDF_PEPPER
        generateValue: true
      - key: BCRYPT_COST
        value: "12"
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_TTL_DAYS
        value: "14"

      # --- CORS ---
      # Lock this down once you know your frontend origin(s). For dev you can
      # keep "*". For an Android release build, the app does not send Origin
      # so this is mostly for the future web client.
      - key: CORS_ORIGINS
        value: "*"

      # --- Face / device / geo tuning ---
      - key: FACE_SIM_THRESHOLD
        value: "0.55"
      - key: GEO_RADIUS_METERS
        value: "75"
      - key: FACE_EMBED_DIM
        value: "128"