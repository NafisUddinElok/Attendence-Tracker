# Render.com Blueprint — deploy with "New + > Blueprint" and point it at
# this repo. This removes the "teacher/student must be on the same WiFi
# as my laptop" problem entirely: once deployed, the app talks to a real
# public HTTPS URL that works over WiFi or mobile data, from anywhere.
#
# Free tier notes:
#  - The web service free tier spins down after inactivity; the first
#    request after idle can take ~30-50s to wake up. Fine for a class
#    project, mention it to students so a slow first login isn't mistaken
#    for a bug.
#  - The free Postgres tier expires after 90 days — fine to start with,
#    just know you'll need to recreate/upgrade it eventually.
services:
  - type: web
    name: attendance-tracker-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: attendance-tracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: attendance-tracker-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: attendance-tracker-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: attendance-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: attendance-tracker-db
          property: password
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: attendance-tracker-db
    plan: free